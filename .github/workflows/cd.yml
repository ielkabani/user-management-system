# CD: when CI finishes green on master, package the app and publish the jar
name: CD

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ master ]

jobs:
  package:
    # Only continue if CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out the exact commit CI tested
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Package the jar (tests already passed in CI)
        run: ./mvnw -B package -DskipTests

      - name: Publish the jar
        uses: actions/upload-artifact@v7
        with:
          name: db_demo-jar
          path: target/*.jar
          retention-days: 7
