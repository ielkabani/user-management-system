<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - User Management</title>
    <!-- External stylesheets -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>
<body>
    <h1>Login</h1>

    <!-- Flash messages (e.g. "Invalid email or password", "You have been logged out") -->
    <div th:if="${successMessage}" class="message success">
        ✓ <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="message error">
        ✗ <span th:text="${errorMessage}"></span>
    </div>

    <div class="form-container">
        <!-- POST /login → HomeController.login(@ModelAttribute LoginRequest ...) -->
        <form th:action="@{/login}" method="post" th:object="${loginRequest}">

            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" th:field="*{email}"
                       required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="password">Password <span class="required">*</span></label>
                <input type="password" id="password" th:field="*{password}"
                       required placeholder="Enter your password">
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>
    </div>
</body>
</html>
