<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - User Management</title>
    <!-- External stylesheets -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>
<body>
    <h1>Change Password</h1>

    <!-- "user" is the logged-in UserDto, added to the model by HomeController -->
    <p>User: <strong th:text="${user.name}">John Doe</strong></p>

    <!-- Flash messages (e.g. "Current password is incorrect") -->
    <div th:if="${successMessage}" class="message success">
        ✓ <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="message error">
        ✗ <span th:text="${errorMessage}"></span>
    </div>

    <div class="form-container">
        <!-- POST /change-password → HomeController.changePassword(@ModelAttribute ChangePasswordRequest ...)
             The input names must match the fields of ChangePasswordRequest -->
        <form th:action="@{/change-password}" method="post">

            <div class="form-group">
                <label for="oldPassword">Current Password <span class="required">*</span></label>
                <input type="password" id="oldPassword" name="oldPassword"
                       required placeholder="Enter current password">
            </div>

            <div class="form-group">
                <label for="newPassword">New Password <span class="required">*</span></label>
                <input type="password" id="newPassword" name="newPassword"
                       required minlength="8" placeholder="Enter new password">
                <div class="help-text">
                    At least 8 characters, with an uppercase letter, a lowercase letter and a digit.
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-primary">Change Password</button>
                <a th:href="@{/ui/users}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
