<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Details</title>
    <!-- External stylesheets -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/view.css}">
</head>
<body>
    <!-- Who is logged in (UserDto stored in the session at login) -->
    <div class="user-bar">
        Logged in as: <strong th:text="${session.loggedInUser?.name}">User</strong>
        <a th:href="@{/logout}" class="btn btn-danger btn-small">Logout</a>
    </div>

    <h1>User Details</h1>

    <!-- Flash messages (e.g. after a password change on this page) -->
    <div th:if="${successMessage}" class="message success">
        ✓ <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="message error">
        ✗ <span th:text="${errorMessage}"></span>
    </div>

    <div class="user-details">

        <!-- Avatar: first letter of the user's name -->
        <div class="user-avatar">
            <span th:text="${user.name.substring(0, 1).toUpperCase()}">J</span>
        </div>

        <!-- User Information using Thymeleaf expressions -->
        <div class="detail-row">
            <span class="detail-label">User ID:</span>
            <span class="detail-value" th:text="${user.id}">1</span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Name:</span>
            <span class="detail-value" th:text="${user.name}">John Doe</span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Email:</span>
            <!-- Thymeleaf link with expression -->
            <span class="detail-value">
                <a th:href="'mailto:' + ${user.email}" th:text="${user.email}">john@example.com</a>
            </span>
        </div>

        <!-- Account status: one of the two spans is rendered -->
        <div class="detail-row">
            <span class="detail-label">Status:</span>
            <span class="detail-value">
                <span th:if="${user.active}" class="status status-active">✓ Active</span>
                <span th:unless="${user.active}" class="status status-inactive">✗ Inactive</span>
            </span>
        </div>

        <!-- Action Buttons -->
        <div class="actions">
            <!-- Thymeleaf URL builder with path variable -->
            <a th:href="@{/ui/users/{id}/edit(id=${user.id})}" class="btn btn-warning">Edit User</a>

            <!-- Activate / Deactivate → UserUIController (redirects back to the list) -->
            <form th:if="${!user.active}" th:action="@{/ui/users/{id}/activate(id=${user.id})}"
                  method="post" style="display:inline;">
                <button type="submit" class="btn btn-success">Activate Account</button>
            </form>
            <form th:if="${user.active}" th:action="@{/ui/users/{id}/deactivate(id=${user.id})}"
                  method="post" style="display:inline;">
                <button type="submit" class="btn btn-secondary"
                        onclick="return confirm('Deactivate this user account?')">Deactivate Account</button>
            </form>

            <!-- Form for DELETE method -->
            <form th:action="@{/ui/users/{id}(id=${user.id})}" method="post" style="display:inline;">
                <input type="hidden" name="_method" value="DELETE">
                <button type="submit" class="btn btn-danger"
                        onclick="return confirm('Are you sure you want to delete this user?')">
                    Delete User
                </button>
            </form>

            <a href="/ui/users" class="btn btn-secondary">Back to List</a>
        </div>

        <!-- Change Password: a plain HTML form, no JavaScript.
             <details> shows / hides it; the form posts to
             HomeController: POST /{id}/change-password, which redirects back here
             with a success or error flash message. -->
        <details class="password-panel">
            <summary class="btn btn-info">Change Password</summary>

            <form th:action="@{/{id}/change-password(id=${user.id})}" method="post">
                <div class="form-group">
                    <label for="oldPassword">Current Password</label>
                    <input type="password" id="oldPassword" name="oldPassword" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" required minlength="8">
                    <div class="help-text">
                        At least 8 characters, with an uppercase letter, a lowercase letter and a digit.
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Update Password</button>
            </form>
        </details>
    </div>

</body>
</html>
